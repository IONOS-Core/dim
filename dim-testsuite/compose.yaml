name: dim-testsuite

# The test suite hardcodes 127.0.0.1:3307 for mariadb and 127.1.1.1 / 127.2.2.2
# for the two pdns instances, so every service shares mariadb's network
# namespace.
services:
  mariadb:
    image: mariadb:10.6.27
    command: --port=3307 --max-allowed-packet=64M --skip-name-resolve
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - ./docker/mariadb-init.sh:/docker-entrypoint-initdb.d/10-dim.sh:ro
      - ./testenv/pdns.sql:/pdns.sql:ro
    # every run starts from an empty database
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:3307:3307"
      - "127.0.0.1:5153:5153"
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-P3307", "-uroot", "-e", "select count(*) from domains", "pdns1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 60s

  pdns1:
    image: powerdns/pdns-auth-50:5.0.3
    network_mode: "service:mariadb"
    volumes:
      - ./docker/pdns1.conf:/etc/powerdns/pdns.conf:ro
    depends_on:
      mariadb:
        condition: service_healthy

  pdns2:
    image: powerdns/pdns-auth-50:5.0.3
    network_mode: "service:mariadb"
    volumes:
      - ./docker/pdns2.conf:/etc/powerdns/pdns.conf:ro
    depends_on:
      mariadb:
        condition: service_healthy

  pdns-unit:
    image: powerdns/pdns-auth-50:5.0.3
    network_mode: "service:mariadb"
    volumes:
      - ./docker/pdns-unit.conf:/etc/powerdns/pdns.conf:ro
    depends_on:
      mariadb:
        condition: service_healthy

  dim-mw:
    build:
      context: ..
      dockerfile: dim-testsuite/Dockerfile
    network_mode: "service:mariadb"
    depends_on:
      mariadb:
        condition: service_healthy
      pdns1:
        condition: service_started
      pdns2:
        condition: service_started
    volumes:
      - ../dim/dim:/src/dim/dim:ro
      - ../dimclient/dimclient:/src/dimclient/dimclient:ro
      - ../ndcli/dimcli:/src/ndcli/dimcli:ro
      - ./docker:/src/dim-testsuite/docker:ro
      - ./e2e:/src/dim-testsuite/e2e:ro
      - ../pdns-output:/src/pdns-output:ro
    environment:
      PYTHONPATH: "/src/dim:/src/dimclient:/src/ndcli"
      NDCLI_SERVER: "http://localhost:5000"
      NDCLI_USERNAME: "admin"
    command: ["mw"]

  dim-output:
    build:
      context: ..
      dockerfile: dim-testsuite/Dockerfile
    network_mode: "service:mariadb"
    depends_on:
      mariadb:
        condition: service_healthy
      pdns1:
        condition: service_started
      pdns2:
        condition: service_started
      dim-mw:
        condition: service_started
    volumes:
      - ./docker:/src/dim-testsuite/docker:ro
      - ../pdns-output:/src/pdns-output
    command: ["output"]

  docs:
    build:
      context: ..
      dockerfile: dim-testsuite/Dockerfile
    volumes:
      - ../dim/doc:/src/dim/doc
    entrypoint: ["/src/dim-testsuite/virtual_env/bin/sphinx-build"]
    command: ["-b", "html", "-d", "/src/dim/doc/_build/doctrees", "/src/dim/doc", "/src/dim/doc/_build/html"]

  testsuite:
    build:
      context: ..
      dockerfile: dim-testsuite/Dockerfile
    network_mode: "service:mariadb"
    depends_on:
      mariadb:
        condition: service_healthy
      pdns1:
        condition: service_started
      pdns2:
        condition: service_started
    volumes:
      - ../dim/dim:/src/dim/dim:ro
      - ../dimclient/dimclient:/src/dimclient/dimclient:ro
      - ../ndcli/dimcli:/src/ndcli/dimcli:ro
      - ../dim-testsuite/tests:/src/dim-testsuite/tests:ro
      - ../dim-testsuite/t:/src/dim-testsuite/t:ro
      - ../dim-testsuite/docker:/src/dim-testsuite/docker:ro
      - ../dim-testsuite/e2e:/src/dim-testsuite/e2e:ro
      - ./runtest.py:/src/dim-testsuite/runtest.py:ro
      - ../pdns-output:/src/pdns-output:ro
    environment:
      PYTHONPATH: "/src/dim:/src/dimclient:/src/ndcli"
      TESTS: "${TESTS:-}"
      PYTESTS: "${PYTESTS:-}"
    command: ["all"]
