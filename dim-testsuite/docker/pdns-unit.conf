local-address=0.0.0.0
local-port=5153

launch=gmysql
gmysql-host=127.0.0.1
gmysql-port=3307
gmysql-dbname=pdns1
gmysql-user=pdns
gmysql-password=pdns
gmysql-dnssec=yes

cache-ttl=0
query-cache-ttl=0
negquery-cache-ttl=0
zone-cache-refresh-interval=0

disable-axfr=no
allow-axfr-ips=0.0.0.0/0,127.0.0.0/8

daemon=no
guardian=no
loglevel=3
query-logging=no
log-dns-details=no
webserver=no
