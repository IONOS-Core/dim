# second pdns instance, used by tests/pdns_changes.py
local-address=127.2.2.2
local-port=53

launch=gmysql
gmysql-host=127.0.0.1
gmysql-port=3307
gmysql-dbname=pdns2
gmysql-user=pdns
gmysql-password=pdns
gmysql-dnssec=yes

# the tests change zones and query them immediately afterwards, so nothing may
# be cached
cache-ttl=0
query-cache-ttl=0
negquery-cache-ttl=0
zone-cache-refresh-interval=0

disable-axfr=no
allow-axfr-ips=127.0.0.0/8

daemon=no
guardian=no
loglevel=3
query-logging=no
log-dns-details=no
webserver=no
