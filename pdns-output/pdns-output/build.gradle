plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'dim'
version = '5.0.4'

application {
    mainClass = 'dim.PdnsOutput'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':jdnssec-tools')
    implementation project(':jdnssec-dnsjava')
    implementation project(':gmp-rsa')

    implementation 'org.jooq:jooq:3.18.29'
    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'com.zaxxer:HikariCP:6.3.0'

    implementation 'commons-cli:commons-cli:1.11.0'

    implementation 'org.apache.logging.log4j:log4j-core:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'
    implementation 'org.slf4j:jul-to-slf4j:2.0.17'

    testImplementation 'commons-io:commons-io:2.22.0'
    testImplementation 'junit:junit:4.13.2'
}
