buildscript {
    repositories { mavenCentral() }
}

plugins {
    id 'java'
    id 'maven-publish'
}

group = 'dim'
version = '0.1'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation group: 'net.java.dev.jna', name: 'jna', version: '5.17.0'
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.80'
    implementation group: 'org.bouncycastle', name: 'bcutil-jdk18on', version: '1.80'

    testImplementation 'junit:junit:4.13.2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
