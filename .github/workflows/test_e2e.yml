name: E2E & Scenario Tests

on:
  pull_request:
    paths:
      - '.github/workflows/test_e2e.yml'
      - 'dim/**'
      - 'ndcli/**'
      - 'dimclient/**'
      - 'dim-testsuite/**'
      - 'pdns-output/**'
      - 'Makefile'
  push:
    paths:
      - '.github/workflows/test_e2e.yml'
      - 'dim/**'
      - 'ndcli/**'
      - 'dimclient/**'
      - 'dim-testsuite/**'
      - 'pdns-output/**'
      - 'Makefile'

jobs:
  test_scenarios:
    name: Scenario Tests (t/*.t)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run scenario tests (t/*.t)
        run: make test-scenarios

  test_e2e:
    name: Live Testbed E2E Suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Start DIM testbed
        run: make testbed-start

      - name: Run E2E testbed scenario tests
        run: make test-e2e

      - name: Stop DIM testbed
        if: always()
        run: make testbed-stop
